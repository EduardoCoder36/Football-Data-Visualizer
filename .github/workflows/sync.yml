name: Schedule Match Ingestion

on:
  schedule:
    # 1. Run once every night at 23:00 UTC for scheduled checks
    - cron: '0 23 * * *'
    # 2. Run hourly on Saturday & Sunday (13:00 to 20:00 UTC) during match action
    - cron: '0 13-20 * * 6,0'
  workflow_dispatch: # Allows triggering manually from GitHub web UI anytime

jobs:
  sync-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Trajectory Sync Worker
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx services/sync-worker/index.ts
